# Overlay for homelab ceiling sweeps (layer after a placement file such as
# charts/stt-bench/values-colocated.yaml). Gateways whose chart defaults are
# 2 vCPU are re-shaped to the 1-vCPU contract shape here; the sweep driver
# applies 2-vCPU shapes per gateway with --set. Jobs from the chart are off:
# the driver creates its own loadgen Jobs through scripts/bench/run_point.sh.
imagePullSecrets:
  - name: ghcr-pull-secret
images:
  registry: ghcr.io
  repository: cezarc1/websocket-stt-bench
  pullPolicy: Always
loadgen:
  enabled: false
inferbench:
  enabled: false
results:
  createPvc: false
gateways:
  rust:
    env: { WORKER_THREADS: "1", INFERENCE_HTTP_CLIENTS: "512" }
    resources: { requests: { cpu: "1", memory: 4Gi }, limits: { cpu: "1", memory: 4Gi } }
  elixir:
    env: { WORKER_THREADS: "1", FINCH_POOL_COUNT: "512" }
    resources: { requests: { cpu: "1", memory: 4Gi }, limits: { cpu: "1", memory: 4Gi } }
  # Same Granian shape as the GIL build at 1 vCPU (st mode, uvloop) so only the
  # interpreter differs; null removes the chart's GRANIAN_LOOPS (which selects mt).
  pythonFt:
    env: { WORKER_THREADS: "1", GRANIAN_LOOPS: null, GRANIAN_LOOP_KIND: uvloop, GRANIAN_TASK_IMPL: asyncio }
    resources: { requests: { cpu: "1", memory: 4Gi }, limits: { cpu: "1", memory: 4Gi } }
  pythonFt315:
    env: { WORKER_THREADS: "1", GRANIAN_LOOPS: null, GRANIAN_LOOP_KIND: uvloop, GRANIAN_TASK_IMPL: asyncio }
    resources: { requests: { cpu: "1", memory: 4Gi }, limits: { cpu: "1", memory: 4Gi } }
