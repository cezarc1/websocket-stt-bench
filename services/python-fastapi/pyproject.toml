# CPython 3.15.2t / 3.15.2 gateway (images python-fastapi-ft315 / -gil315).
# Container-only: the interpreters come from the pinned manylinux image, so
# `just python-check` runs ruff + ty + pytest in the Dockerfile's `test` stage.
#
# Pins: the lowest stable release that ships cp315 AND cp315t manylinux wheels
# (or is pure Python). frozenlist has no cp315 wheel in any release, so it
# installs its pure-Python wheel (aiohttp only uses it for signal lists, off
# the request path).
[project]
name = "stt-fastapi-gateway"
version = "0.1.0"
description = "FastAPI implementation for websocket-stt-bench"
requires-python = "==3.15.2"
dependencies = [
    "aiohttp==3.14.4",
    "fastapi==0.136.1",
    "granian[uvloop,rloop]==2.8.7",
    "pydantic==2.14.0",
    "wsproto==1.3.2",
]

# pyperf is left out: its psutil dependency has no cp315t wheel in any release.
[dependency-groups]
dev = [
    "ruff==0.15.12",
    "ty==0.0.31",
    "pytest==8.4.2",
    "numpy==2.5.2",
]

[tool.uv]
required-version = "==0.11.7"
python-preference = "only-system"
python-downloads = "never"
# Wheels only: a missing cp315/cp315t wheel must fail the image build rather
# than silently compile from an sdist with unpinned build dependencies.
no-build = true
# Compiled transitive deps pinned to the first releases with cp315 wheels.
constraint-dependencies = [
    "multidict==6.8.0",
    "propcache==0.5.3",
    "yarl==1.25.1",
    "uvloop==0.23.0",
    "rloop==0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus a curated set of higher-value rule families.
# Ruff has no built-in "recommended"/"strict" preset; this is the closest
# equivalent. Using `extend-select` lets ruff's evolving defaults flow through
# instead of pinning them here.
extend-select = [
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async (catches blocking calls in async, unawaited coros)
    "RUF",    # ruff-specific (dead code, ambiguous patterns)
    "PERF",   # performance anti-patterns
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie (misc anti-patterns)
    "RET",    # flake8-return (consistent return)
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "FA",     # flake8-future-annotations
    "FURB",   # refurb (modernisation; incl. some perf-flavoured idioms)
]

[tool.ruff.lint.per-file-ignores]
# Bench files intentionally exercise the patterns PERF flags.
"tests/bench_*.py" = ["PERF"]

[tool.ty.environment]
python = "./.venv"
