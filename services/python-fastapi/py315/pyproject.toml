# CPython 3.15 lock for the SAME gateway code (../app). Only the images built
# with PY_PROJECT_DIR=services/python-fastapi/py315 use it; the 3.14.4 / 3.14.4t
# images keep using ../pyproject.toml + ../uv.lock unchanged. Lint/type config
# lives in ../pyproject.toml.
#
# Pins: identical to ../pyproject.toml where that release ships cp315 AND
# cp315t manylinux wheels (or is pure Python); otherwise the LOWEST stable
# release that does, to keep the 3.14-vs-3.15 dependency delta minimal.
# frozenlist has no cp315 wheel in any release, so it installs its pure-Python
# wheel here (aiohttp only uses it for signal lists, off the request path).
[project]
name = "stt-fastapi-gateway"
version = "0.1.0"
description = "FastAPI implementation for websocket-stt-bench (CPython 3.15 lock)"
requires-python = "==3.15.2"
dependencies = [
    "aiohttp==3.14.4",  # 3.13.5 has no cp315 wheels
    "fastapi==0.136.1",
    "granian[uvloop,rloop]==2.8.7",
    "pydantic==2.14.0",  # 2.13.x pins pydantic-core 2.46.x, which has no cp315 wheels
    "wsproto==1.3.2",
]

# Only what the Dockerfile `test` stage (just python315-check) runs: pytest +
# ty. pyperf is left out: its psutil dependency has no cp315t wheel in any
# release, and it only drives the tests/bench_stub.py micro-benchmark.
[dependency-groups]
dev = [
    "ty==0.0.31",
    "pytest==8.4.2",
    "numpy==2.5.2",  # 2.4.4 has no cp315 wheels
]

[tool.uv]
required-version = "==0.11.7"
python-preference = "only-system"
python-downloads = "never"
# Wheels only: a missing cp315/cp315t wheel must fail the image build rather
# than silently compile from an sdist with unpinned build dependencies.
no-build = true
# Compiled transitive deps whose ../uv.lock versions have no cp315 wheels.
constraint-dependencies = [
    "multidict==6.8.0",
    "propcache==0.5.3",
    "yarl==1.25.1",
    "uvloop==0.23.0",
    "rloop==0.3.0",
]
