[workspace]
members = ["crates/stt-stub", "loadgen/rust", "services/inference-server", "services/rust-axum", "services/rust-sync"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95.0"

[workspace.dependencies]
anyhow = "=1.0.103"
axum = { version = "=0.8.9", features = ["ws", "http2"] }
bytes = "=1.11.1"
clap = { version = "=4.6.1", features = ["derive", "env"] }
futures-util = "=0.3.32"
hdrhistogram = "=7.5.4"
rand = "=0.10.1"
rand_distr = "=0.6.0"
reqwest = { version = "=0.12.27", default-features = false, features = ["http2", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.53.3", features = ["full"] }
tokio-tungstenite = "=0.29.0"
tungstenite = "=0.29.0"
tracing = "=0.1.44"
socket2 = "=0.6.3"
# Internal shared crate; exact version keeps cargo-deny `wildcards = "deny"` happy.
stt-stub = { path = "crates/stt-stub", version = "=0.1.0" }
mio = { version = "=1.2.0", features = ["net", "os-poll"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

# Perf-oriented lints on top of clippy's defaults. `just rust-check` runs clippy
# with `-D warnings`, so every "warn" here fails the gate. Several of these
# live in pedantic/nursery and must be named individually.
[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
format_collect = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_box_returns = "warn"

# Benchmark binaries: cross-crate inlining + single codegen unit so hot loops
# (the loadgen's frame generator/HDR histogram, the inference server's
# compute_stub, the rust-axum select! arms) get the strongest backend
# optimization. `panic = "abort"` removes unwind tables, which we don't need
# in services that exit on the first panic.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
