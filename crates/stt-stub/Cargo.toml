[package]
name = "stt-stub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Single Rust implementation of the deterministic STT stub. The inference
# server computes it on the runtime path; the loadgen and stt-conformance
# recompute it client-side to verify every partial a gateway forwards.
# Explicit [lib] so the manifest stays a valid workspace member even in
# Dockerfiles that copy only this crate's Cargo.toml.
[lib]
path = "src/lib.rs"

[dependencies]

[lints]
workspace = true
