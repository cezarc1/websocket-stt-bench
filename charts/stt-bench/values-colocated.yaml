# Single-node placement for gateway-bound capacity runs on the homelab k3s
# cluster: the gateway under test, the load generator and the shared
# inference server all on cezar-4090 (32 CPUs), so no request crosses the
# LAN. Inference gets 3 x 6-CPU replicas so it stays far below its own
# saturation point (benchmark it with stt-inferbench before trusting a sweep).
# CPU budget: inference 18 + loadgen 4 + gateway <= 2 = 24 of 32 cores.
# Layer on top of your homelab values:
#   helm upgrade --install stt-bench charts/stt-bench -n stt-bench \
#     -f <your-homelab-values>.yaml -f charts/stt-bench/values-colocated.yaml

gatewayNodeSelector:
  kubernetes.io/hostname: cezar-4090

loadgen:
  nodeSelector:
    kubernetes.io/hostname: cezar-4090

inferbench:
  nodeSelector:
    kubernetes.io/hostname: cezar-4090

inference:
  replicas: 3
  # 3 x 4 CPU leaves room on the node for a 2-vCPU gateway plus a 12-CPU loadgen.
  # Measured inference use stays under ~1.3 cores even at 5,500 sessions.
  env:
    WORKER_THREADS: "4"
  resources:
    requests: { cpu: "4", memory: 2Gi }
    limits: { cpu: "4", memory: 2Gi }
  # A rolling update would need room for 3 more pods.
  strategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: cezar-4090
