# Single-node placement for gateway-bound capacity runs on the homelab k3s
# cluster: the gateway under test, the load generator and the shared
# inference server all on cezar-4090 (32 CPUs), so no request crosses the
# LAN. Every pod is pinned to fixed P-core logical CPUs (layout in the inference
# block): gateway CPUs 0,2, loadgen CPUs 4-11 (8 logical CPUs = 4 P-cores, 8 Tokio
# workers), inference CPUs 12-15 (3 x 4-CPU replicas sharing those 4 logical
# CPUs; measured use stays under ~1.3 CPUs). Unpinned, gateways competed with the loadgen for cores 4-11.
# Layer on top of your homelab values:
#   helm upgrade --install stt-bench charts/stt-bench -n stt-bench \
#     -f <your-homelab-values>.yaml -f charts/stt-bench/values-colocated.yaml

gatewayNodeSelector:
  kubernetes.io/hostname: cezar-4090
# Logical CPUs 0 and 2: one hyperthread on each of the first two P-cores.
gatewayCpuAffinity: "0,2"

loadgen:
  nodeSelector:
    kubernetes.io/hostname: cezar-4090

inferbench:
  nodeSelector:
    kubernetes.io/hostname: cezar-4090

inference:
  replicas: 3
  # Measured inference use stays under ~1.3 cores even at 6,900 sessions.
  # cezar-4090 is an i9-13900F: P-cores are hyperthread pairs (0,1) .. (14,15),
  # E-cores are 16-31. Layout: gateway on one thread of each of the first two
  # P-cores (0,2; siblings 1,3 left idle), loadgen on logical CPUs 4-11
  # (P-cores 2-5; sweep.py --loadgen-cpuset 4-11), inference on CPUs 12-15 (P-cores 6-7).
  cpuAffinity: "12-15"
  env:
    WORKER_THREADS: "4"
  resources:
    requests: { cpu: "4", memory: 2Gi }
    limits: { cpu: "4", memory: 2Gi }
  # A rolling update would need room for 3 more pods.
  strategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: cezar-4090
